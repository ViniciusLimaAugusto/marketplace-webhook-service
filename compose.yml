services:
  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://marketplace_app:${COMPOSE_APP_PASSWORD:-demo-app-only}@db:5432/marketplace_webhook_service
    ports:
      - '127.0.0.1:${COMPOSE_API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [frontend, database]

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: marketplace_webhook_service
      POSTGRES_PASSWORD: ${COMPOSE_ADMIN_PASSWORD:-demo-admin-only}
      MARKETPLACE_APP_PASSWORD: ${COMPOSE_APP_PASSWORD:-demo-app-only}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/database/compose-init.sql:/docker-entrypoint-initdb.d/01-marketplace.sql:ro
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-h',
          '127.0.0.1',
          '-d',
          'marketplace_webhook_service',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [database]

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres-data:
